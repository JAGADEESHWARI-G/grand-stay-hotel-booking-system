<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Stay | Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101827, #26354d, #111827);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        .login-icon {
            width: 75px;
            height: 75px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9efff;
            color: #1d4ed8;
            border-radius: 50%;
            font-size: 30px;
        }

        .login-card h2 {
            font-weight: 700;
            margin-top: 20px;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .login-btn {
            height: 48px;
            border-radius: 10px;
            font-weight: 600;
            background: #1e293b;
            color: white;
            border: none;
        }

        .login-btn:hover {
            background: #334155;
            color: white;
        }

        .login-btn:disabled {
            opacity: 0.7;
           }

        .back-link {
            text-decoration: none;
            color: #64748b;
        }

        .back-link:hover {
            color: #1e293b;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="text-center">

            <div class="login-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <h2>Admin Login</h2>
            <p class="text-muted">Grand Stay Management Portal</p>

        </div>

        <div id="loginAlert" class="alert d-none mt-3"></div>

        <form id="adminLoginForm" class="mt-4">

            <div class="mb-3">
                <label class="form-label">Email Address</label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter admin email"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>

                <div class="input-group">
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        id="togglePassword"
                    >
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="btn login-btn w-100 mt-3"
                id="loginButton"
            >
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Login
            </button>

        </form>

        <div class="text-center mt-4">
            <a href="index.html" class="back-link">
                <i class="bi bi-arrow-left"></i>
                Back to Home
            </a>
        </div>

    </div>

    <script src="js/admin-login.js"></script>

</body>
</html>
