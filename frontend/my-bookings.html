<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings | Grand Stay</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                GRAND STAY
            </a>

            <a href="index.html" class="btn btn-outline-light">
                Back to Home
            </a>
        </div>
    </nav>


    <!-- My Bookings -->
    <section class="container py-5 mt-5">

        <div class="text-center mb-4">
            <h1>My Bookings</h1>
            <p class="text-muted">
                View and manage your hotel reservations.
            </p>
        </div>

        <!-- Email Search -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-7">

                <form id="searchForm" class="input-group">

                    <input
                        type="email"
                        id="customerEmail"
                        class="form-control"
                        placeholder="Enter your registered email"
                        required>

                    <button class="btn btn-primary" type="submit">
                        Search Bookings
                    </button>

                </form>

            </div>
        </div>


        <!-- Alert -->
        <div id="bookingAlert"></div>


        <!-- Booking Cards -->
        <div class="row" id="bookingsContainer">

            <div class="col-12 text-center text-muted">
                Enter your registered email to view bookings.
            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">
            © 2026 Grand Stay. All Rights Reserved.
        </p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/my-bookings.js"></script>

</body>
</html>
