<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Your Stay | Grand Stay</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">GRAND STAY</a>

        <a href="index.html" class="btn btn-outline-light">
            Back to Home
        </a>
    </div>
</nav>


<!-- Booking Section -->
<section class="container py-5 mt-5">

    <div class="text-center mb-4">
        <h1>Book Your Stay</h1>
        <p class="text-muted">
            Complete your details to confirm your reservation.
        </p>
    </div>

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow p-4">

                <form id="bookingForm">

                    <!-- Selected Room -->
                    <h4 class="mb-3">Room Details</h4>

                    <div class="mb-3">
                        <label class="form-label">Room</label>

                        <select
                            class="form-select"
                            id="roomId"
                            name="room_id"
                            required
                        >
                            <option value="">Loading rooms...</option>
                        </select>
                    </div>


                    <hr>

                    <!-- Customer Details -->
                    <h4 class="mb-3">Customer Details</h4>

                    <div class="mb-3">
                        <label class="form-label">Registered Email</label>

                        <input
                            type="email"
                            class="form-control"
                            id="gmail"
                            name="gmail"
                            placeholder="Enter your registered email"
                            required
                        >
                    </div>


                    <hr>

                    <!-- Booking Details -->
                    <h4 class="mb-3">Booking Details</h4>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Check-in Date</label>

                            <input
                                type="date"
                                class="form-control"
                                id="checkIn"
                                name="check_in"
                                required
                            >
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Check-out Date</label>

                            <input
                                type="date"
                                class="form-control"
                                id="checkOut"
                                name="check_out"
                                required
                            >
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Number of Guests</label>

                            <input
                                type="number"
                                class="form-control"
                                id="guests"
                                name="guests"
                                min="1"
                                value="1"
                                required
                            >
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Number of Rooms</label>

                            <input
                                type="number"
                                class="form-control"
                                id="numberOfRooms"
                                name="number_of_rooms"
                                min="1"
                                value="1"
                                required
                            >
                        </div>

                    </div>


                    <div id="bookingAlert"></div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100 mt-3"
                    >
                        Confirm Booking
                    </button>

                </form>

            </div>

        </div>

    </div>

</section>


<footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">
        © 2026 Grand Stay. All Rights Reserved.
    </p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/booking.js"></script>

</body>
</html>
